[project]
name = "warszawa-backend"
version = "0.1.0"
description = "Warszawa Live backend: FastAPI + Postgres/PostGIS"
authors = [
    { name = "vrouxel", email = "vrouxel@student.42warsaw.pl" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "ctranslate2>=4.8",
    "email-validator>=2.3.0",
    "fastapi>=0.143.3",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.31.0",
    "sentencepiece>=0.2.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.114",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions", "db"]  # generated migrations; db/ = Mateusz's standalone SQLite scripts

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501"]  # FastAPI Depends()/Query() defaults; HTTPException in except; ruff format owns line length

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not our ./alembic folder
