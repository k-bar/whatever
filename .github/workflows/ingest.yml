# Data orchestrator: pulls every source into the production database.
# Runs hourly, or by hand: Actions tab -> Ingest -> Run workflow (or `gh workflow run ingest.yml`).
# Needs repo secrets DATABASE_URL (Render external connection string) and WARSAW_API_TOKEN.
name: Ingest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source slug (empty = all)"
        required: false
        default: ""
      geocode_limit:
        description: "Max Nominatim lookups per source"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WARSAW_API_TOKEN: ${{ secrets.WARSAW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run fetchers and load
        env:
          SOURCE: ${{ inputs.source }}
          GEOCODE_LIMIT: ${{ inputs.geocode_limit || '200' }}
        run: |
          args=(--geocode-limit "$GEOCODE_LIMIT")
          [ -n "$SOURCE" ] && args+=(--source "$SOURCE")
          set -o pipefail
          uv run python -m app.ingest.run "${args[@]}" 2>&1 | tee ingest.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest"
            echo '```'
            grep -E "fetched|FAILED" ingest.log || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
