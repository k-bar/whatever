<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syrenka</title>
<link rel="icon" type="image/svg+xml" href="/mermaid/07-app-tile.svg">
<style>
  :root { --bg: #F6F1EC; --ink: #22140F; --muted: #7A6A62; --accent: #E72214; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1210; --ink: #F6F1EC; --muted: #B8A79E; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 32rem; }
  img { width: min(220px, 60vw); height: auto; }
  h1 { font-size: 2.4rem; margin: .5rem 0 0; }
  p { color: var(--muted); line-height: 1.5; }
  .env { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: var(--accent); color: #fff;
         font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="/mermaid.svg" alt="Syrenka, the Warsaw mermaid" onerror="this.remove()">
  <h1>Syrenka</h1>
  <p>Everything social happening in Warsaw, on one map. Coming soon.</p>
  <p><span class="env" id="env" hidden></span></p>
  <p><a id="api" href="#">API docs</a> · <a href="/mermaid/">Syrenka icons</a></p>
</main>
<script>
  fetch("/config.json").then(r => r.json()).then(c => {
    document.getElementById("api").href = c.apiUrl + "/docs";
    if (c.env && c.env !== "prod") { const e = document.getElementById("env"); e.textContent = c.env; e.hidden = false; }
  }).catch(() => {});
</script>
</body>
</html>
