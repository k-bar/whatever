[project]
name = "warszawa-infra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["cdk.out", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
