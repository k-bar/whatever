# Local Postgres + PostGIS on the same port as backend/scripts/dev-postgres.sh.
#   docker compose up -d db
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: warszawa
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

  postgres:
    image: postgres:16-alpine
    container_name: warszawa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warszawa
      POSTGRES_PASSWORD: warszawa_password
      POSTGRES_DB: warszawa_live
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warszawa -d warszawa_live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
